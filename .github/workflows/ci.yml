name: CI

on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless; don't pay for it twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `playwright` is a devDependency for `npm run screenshots`, which CI never runs. Without
      # this its postinstall would download ~130 MB of browsers into every job for nothing.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      # tsc --noEmit && vite build: type errors fail here, not on a device.
      - run: npm run build
