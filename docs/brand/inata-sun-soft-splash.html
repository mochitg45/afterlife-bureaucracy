<title>Inata Sun Soft Splash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
  :root { --bg: #ffffff; --ink: #3f6e96; --sun1: #ffb100; --sun2: #ff8a1f; --sun3: #f2652b; --sun4: #ffcf33; --ray: #f9b322; --muted: #8a94a3; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-inline: 16px; padding-block: 24px; box-sizing: border-box; min-height: 100%; }
  .stage { position: relative; width: min(92vw, 420px); aspect-ratio: 1; max-width: 100%; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .ray { stroke: var(--ray); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 60; stroke-dashoffset: 60; opacity: 0; animation: ray .55s cubic-bezier(.2,.8,.2,1) forwards; }
  .facet { transform-box: fill-box; transform-origin: center; transform: scale(0); opacity: 0; animation: facet .45s cubic-bezier(.2,.9,.2,1.2) forwards; }
  .word { font-weight: 900; font-size: 50px; letter-spacing: 7px; fill: var(--ink); opacity: 0; animation: word .8s ease-out forwards; animation-delay: 1.7s; }
  .glow { fill: var(--sun4); opacity: 0; transform-box: fill-box; transform-origin: center; animation: glow 1.4s ease-out forwards; animation-delay: 1.5s; }
  .stage.out { animation: fadeout .7s ease-in forwards; animation-delay: 3.2s; }
  .after { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; animation: fadein .6s ease-out forwards; animation-delay: 3.7s; font-family: 'Courier New', monospace; font-weight: 700; font-size: 22px; color: #1f3b33; text-align: center; letter-spacing: .03em; }
  .bar { margin-top: 28px; display: flex; gap: 12px; align-items: center; }
  button { font: inherit; font-weight: 800; padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sun2); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 13px; max-width: 42ch; text-align: center; line-height: 1.45; margin-top: 10px; }
  @keyframes ray { to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes facet { to { transform: scale(1); opacity: 1; } }
  @keyframes word { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.6); } 40% { opacity: .35; } 100% { opacity: 0; transform: scale(1.5); } }
  @keyframes fadeout { to { opacity: 0; } }
  @keyframes fadein { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ray, .facet, .word { animation: none; opacity: 1; stroke-dashoffset: 0; transform: none; } .glow { display: none; } .stage.out { animation: none; } .after { animation: none; opacity: 0; } }
</style>

<div class="wrap" style="display:flex;flex-direction:column;align-items:center;">
  <div class="stage" id="stage">
    <svg viewBox="0 0 512 512" aria-label="Inata Sun Soft">
      <defs>
        <path id="arc" d="M 26 310 A 230 230 0 0 1 486 310" fill="none"></path>
      </defs>
      <g id="rays"></g>
      <circle class="glow" cx="256" cy="310" r="110"></circle>
      <g id="facets"></g>
      <text class="word" text-anchor="middle"><textPath href="#arc" startOffset="50%">INATA SUN SOFT</textPath></text>
    </svg>
    <div class="after" id="after">Afterlife<br>Bureaucracy Inc.</div>
  </div>
  <div class="bar">
    <button id="replay" type="button">Replay</button>
    <button id="loop" type="button" aria-pressed="false">Loop: off</button>
  </div>
  <p class="note">Splash mockup: rays sweep in, the sun's facets light up, the name settles, then it fades into the title screen. About 4 seconds, skippable on tap in the real app.</p>
</div>

<script>
(function () {
  const raysG = document.getElementById('rays');
  const facetsG = document.getElementById('facets');
  const stage = document.getElementById('stage');
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 256, CY = 310, R = 104;
  const palette = ['#ffb100', '#ff8a1f', '#f2652b', '#ffcf33', '#ff9d2e', '#ffc41f', '#f4741f'];

  function build() {
    raysG.innerHTML = ''; facetsG.innerHTML = '';
    const rayCount = 28;
    for (let i = 0; i < rayCount; i++) {
      const a = (i / rayCount) * Math.PI * 2 - Math.PI / 2;
      const long = i % 2 === 0;
      const r1 = R + 22, r2 = R + (long ? 74 : 52);
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', CX + Math.cos(a) * r1); l.setAttribute('y1', CY + Math.sin(a) * r1);
      l.setAttribute('x2', CX + Math.cos(a) * r2); l.setAttribute('y2', CY + Math.sin(a) * r2);
      l.setAttribute('class', 'ray');
      l.style.animationDelay = (0.15 + i * 0.03) + 's';
      raysG.appendChild(l);
    }
    const outer = [], inner = [];
    const n = 12;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      outer.push([CX + Math.cos(a) * R, CY + Math.sin(a) * R]);
      const jitter = 0.5 + ((i * 7) % 5) * 0.06;
      inner.push([CX + Math.cos(a + 0.26) * R * jitter, CY + Math.sin(a + 0.26) * R * jitter]);
    }
    const tris = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      tris.push([outer[i], outer[j], inner[i]]);
      tris.push([outer[j], inner[j], inner[i]]);
      tris.push([inner[i], inner[j], [CX, CY]]);
    }
    const clip = document.createElementNS(NS, 'clipPath'); clip.setAttribute('id', 'disc');
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', CX); c.setAttribute('cy', CY); c.setAttribute('r', R);
    clip.appendChild(c); facetsG.appendChild(clip);
    const g = document.createElementNS(NS, 'g'); g.setAttribute('clip-path', 'url(#disc)');
    const base = document.createElementNS(NS, 'circle'); base.setAttribute('cx', CX); base.setAttribute('cy', CY); base.setAttribute('r', R);
    base.setAttribute('fill', '#ff9d2e'); base.setAttribute('class', 'facet'); base.style.animationDelay = '0.9s';
    g.appendChild(base);
    tris.forEach((t, k) => {
      const p = document.createElementNS(NS, 'polygon');
      p.setAttribute('points', t.map(q => q.join(',')).join(' '));
      p.setAttribute('fill', palette[(k * 5 + Math.floor(k / 3)) % palette.length]);
      p.setAttribute('class', 'facet');
      const d = Math.hypot((t[0][0] + t[1][0] + t[2][0]) / 3 - CX, (t[0][1] + t[1][1] + t[2][1]) / 3 - CY) / R;
      p.style.animationDelay = (0.95 + d * 0.5 + (k % 4) * 0.04) + 's';
      g.appendChild(p);
    });
    facetsG.appendChild(g);
  }

  let loop = false;
  function play() {
    stage.classList.remove('out');
    const after = document.getElementById('after');
    after.style.animation = 'none';
    build();
    void stage.offsetWidth;
    after.style.animation = '';
    stage.classList.add('out');
  }
  document.getElementById('replay').addEventListener('click', play);
  const loopBtn = document.getElementById('loop');
  loopBtn.addEventListener('click', () => {
    loop = !loop; loopBtn.textContent = 'Loop: ' + (loop ? 'on' : 'off'); loopBtn.setAttribute('aria-pressed', String(loop));
  });
  stage.addEventListener('animationend', (e) => { if (e.target === stage && loop) setTimeout(play, 600); });
  play();
})();
</script>
